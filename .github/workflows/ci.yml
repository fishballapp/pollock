name: CI

# Every gate, on every branch. The private monorepo this tree is ejected from pushes each of its
# pull requests to the branch pr/<number> here, so these run before the private merge; cd.yml calls
# this workflow again on main before it publishes.
on:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer snapshot of a branch supersedes the one under test; main queues behind cd.yml's publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm repojj:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The published bin runs with nothing installed beside it: it bundles its own effect, so a
      # newer one on npm cannot break it. One acquire, status and release proves the bundle opens
      # its database on this Node.
      - name: Run the built bin on its own
        run: |
          cp packages/pollock/dist/bin.mjs "$RUNNER_TEMP/bin.mjs"
          export POLLOCK_STATE_DIR="$RUNNER_TEMP/state"
          cd "$RUNNER_TEMP"
          node bin.mjs --version
          node bin.mjs smoke acquire --session ci
          node bin.mjs smoke status
          node bin.mjs smoke release --session ci
